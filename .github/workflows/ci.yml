name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build without catalog generation
        run: |
          set -euo pipefail
          npx tsgo -p packages/tui/tsconfig.build.json
          npx tsgo -p packages/ai/tsconfig.build.json
          npx tsgo -p packages/agent/tsconfig.build.json
          npm --prefix packages/coding-agent run build
          npm --prefix packages/orchestrator run build
          git diff --exit-code -- packages/ai

      - name: Check first request and lazy tool imports
        run: node scripts/check-interactive-first-paint.mjs

      - name: Check
        # check:ci fails on unformatted code instead of rewriting it like the local check.
        run: npm run check:ci

      - name: Test
        run: npm test

      # build-standalone.test.mjs bundles a probe with bun, like the release binaries.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Script tests
        run: node --test scripts/build-standalone.test.mjs scripts/distribution-lock-graph.test.mjs scripts/release-commands.test.mjs
