name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Check computer-use production approval
        run: node scripts/check-computer-use-release.mjs --production

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build without catalog generation
        run: |
          set -euo pipefail
          npm run build
          git diff --exit-code -- packages/ai

      - name: Check
        run: npm run check:ci

      - name: Test
        run: npm test

      - name: Script tests
        run: node --test scripts/build-standalone.test.mjs scripts/distribution-lock-graph.test.mjs scripts/release-commands.test.mjs

      - name: Prepare pinned computer-use payloads
        run: |
          node scripts/download-computer-use-release.mjs "$RUNNER_TEMP/cua-release"
          node scripts/bundle-computer-use.mjs "$RUNNER_TEMP/cua-release"

      - name: Validate pinned payload staging
        run: |
          node scripts/generate-computer-use-manifest.mjs --check
          node --test scripts/check-computer-use-release.test.mjs scripts/computer-use-packages.test.mjs

      - name: Publish @ashx-j/lunr*
        run: node scripts/publish.mjs --manifest "$RUNNER_TEMP/npm-release.json"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm metadata and tarballs can lag the publish by minutes; the script retries until its deadline.
      - name: Verify registry tarballs and a fresh install
        run: node scripts/verify-npm-release.mjs "$RUNNER_TEMP/npm-release.json" --timeout-minutes 15
