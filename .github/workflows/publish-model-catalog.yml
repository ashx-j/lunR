name: Publish model catalog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "packages/ai/scripts/**"
      - "packages/ai/src/catalog/**"
      - "packages/ai/src/*effort.ts"
      - "scripts/sync-model-catalog.mjs"
      - ".github/workflows/publish-model-catalog.yml"
  pull_request:
    branches: [master]
    paths:
      - "packages/ai/scripts/**"
      - "packages/ai/src/catalog/**"
      - "packages/ai/src/*effort.ts"
      - "scripts/sync-model-catalog.mjs"
      - ".github/workflows/publish-model-catalog.yml"
      - "catalog/**"

permissions:
  contents: read

concurrency:
  group: model-catalog-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Restore last-good public sources
        uses: actions/cache@v4
        with:
          path: .artifacts/model-catalog-sources
          key: catalog-sources-v2-${{ github.run_id }}
          restore-keys: catalog-sources-v2-
      - name: Test discovery and publication contracts
        working-directory: packages/coding-agent
        run: npx vitest --run test/codex-catalog.test.ts test/catalog-autonomy.test.ts test/catalog-sources.test.ts test/sync-model-catalog.test.ts test/official-catalog.test.ts
      - name: Generate and validate
        run: |
          npm run generate:model-catalog
          node scripts/sync-model-catalog.mjs --check
      - name: Report source freshness
        if: always()
        run: |
          if test -f .artifacts/model-catalog/sources.json; then
            node -e 'const s=require("./.artifacts/model-catalog/sources.json"); for(const x of s) console.log(x.status+": "+x.url+" ("+x.fetchedAt+")")' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: model-catalog
          path: .artifacts/model-catalog
          retention-days: 7

  publish:
    needs: generate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: model-catalog
          path: .artifacts/model-catalog
      - name: Open catalog data checkout
        run: |
          if git ls-remote --exit-code --heads origin model-catalog; then
            git fetch origin model-catalog
            git worktree add --detach .catalog-published FETCH_HEAD
          else
            git worktree add --detach .catalog-published HEAD
            git -C .catalog-published switch --orphan model-catalog
          fi
      - name: Publish immutable snapshot and manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node scripts/sync-model-catalog.mjs --versioned --output .catalog-published/catalog --source-commit "$SOURCE_COMMIT"
          git -C .catalog-published config user.name "github-actions[bot]"
          git -C .catalog-published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .catalog-published add catalog
          if ! git -C .catalog-published diff --cached --quiet; then
            git -C .catalog-published commit -m "chore: publish model catalog snapshot"
            git -C .catalog-published push origin HEAD:model-catalog
          fi
