name: Bug Report
description: Report something that's broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The repository's contribution gate auto-closes issues from new contributors. Maintainers can reopen issues and approve contributors.

        Keep this short. If it doesn't fit on one screen, it's too long. Write in your own voice.

        **Important:** before reporting an issue in core, please validate first with `lunr --no-extensions` and report whether it still happens. This skips discovered extensions and deferred interactive built-ins; light built-ins remain active.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Be specific. Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Run lunr --version
    validations:
      required: false
