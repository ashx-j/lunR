name: Package Report
description: Report a problem with an extension package used in lunR
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report an extension package used in lunR. For lunR core bugs, use the bug report template instead. Contact the package maintainer for package-specific support.

        The repository's contribution gate auto-closes issues from new contributors. Maintainers can reopen issues and approve contributors.

        Keep this short. If it doesn't fit on one screen, it's too long. Write in your own voice.

  - type: input
    id: package-name
    attributes:
      label: Package name
      description: The installed npm package name.
      placeholder: "@scope/package"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version
      description: The installed package version.
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Malicious or unsafe behavior
        - Impersonation
        - Trademark / TOS Violations
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern and include links, logs, or screenshots if helpful.
    validations:
      required: true
